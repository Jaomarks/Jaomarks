name: Deploy Lifeshape App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lifeshape-app/package-lock.json

      - name: Install dependencies
        working-directory: lifeshape-app
        run: npm ci

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5
        with:
          # First run on this repo: Pages isn't enabled yet, so let this
          # action create the "build via GitHub Actions" Pages site itself.
          enablement: true

      - name: Build static export
        working-directory: lifeshape-app
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lifeshape-app/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
